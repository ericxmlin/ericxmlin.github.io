<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | escape }}">
  <title>{{ page.title | escape }} · Eric Lin</title>
  <link rel="stylesheet" href="/styles.css?v=about-cards-1">
</head>
<body class="{% if page.url == '/' %}home-page{% else %}content-page{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="navigation" aria-label="Main navigation">
      <a href="/"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="/about/"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="/projects/"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="/photos/"{% if page.url == '/photos/' %} aria-current="page"{% endif %}>Photos</a>
      <a href="/contact/"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </header>

  <main id="main" class="wrap" tabindex="-1">
{{ content }}
  </main>
</body>
</html>
